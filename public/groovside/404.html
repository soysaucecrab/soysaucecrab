<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · GroovSide</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="32x32" href="/groovside/assets/icon-32.png">
<link rel="apple-touch-icon" href="/groovside/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,50&display=swap">
<style>
  :root { --bg: #f6ebec; --fg: #1f2a25; --muted: #5f6b65; --line: #e1cfd1; --accent: #b4412a; --green: #2e5b48; --orange: #e8593a; --vinyl: #1f2a25; --vinyl-2: #2b3832; --serif: "Fraunces", Georgia, serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121714; --fg: #ecebe5; --muted: #a5aea8; --line: #2a332e; --accent: #f07a58; --vinyl: #0b0f0d; --vinyl-2: #1a221e; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  main { max-width: 520px; padding: 48px 20px; text-align: center; }
  .rec { width: 168px; height: 168px; margin: 0 auto 28px; border-radius: 50%; position: relative; box-shadow: 0 18px 30px -18px rgba(0,0,0,.55);
    background: radial-gradient(circle, var(--bg) 0 3.2%, transparent 3.8%), radial-gradient(circle, var(--green) 0 33%, transparent 33.6%), repeating-radial-gradient(circle, var(--vinyl) 0 2px, var(--vinyl-2) 2px 3.5px);
    animation: spin 9s linear infinite; }
  .rec span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 1.05rem/1 var(--serif); color: #f6ebec; letter-spacing: .04em; transform: translateY(-17px); }
  .rec::after { content: ""; position: absolute; left: 63%; top: 38%; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-color-scheme: dark) { .rec { box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 18px 30px -18px rgba(0,0,0,.8); } }
  @media (prefers-reduced-motion: reduce) { .rec { animation: none; } }
  h1 { font-family: var(--serif); font-optical-sizing: auto; font-weight: 600; font-size: 2.3rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 28px; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  nav a { display: inline-block; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 500; }
  nav a.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  nav a:hover { border-color: var(--accent); }
  a:focus-visible { outline: 3px solid #e8593a; outline-offset: 3px; }
  .lang { margin-top: 28px; font-size: .9rem; }
  .lang a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="rec" aria-hidden="true"><span>404</span></div>
  <h1>Page not found</h1>
  <p>There's no page at this address. It may have moved, or the link may have a typo.</p>
  <nav aria-label="Pages">
    <a class="primary" href="/groovside/">GroovSide home</a>
    <a href="/groovside/settings/">Settings guide</a>
    <a href="/groovside/support/">Support</a>
  </nav>
  <div class="lang"><a href="/groovside/ko/" hreflang="ko" lang="ko">한국어</a></div>
</main>
</body>
</html>
